name: Build Desktop Memo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli

      - name: Build exe only (skip bundle to avoid MSI failure blocking artifact)
        run: npx tauri build --no-bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: desktop-memo-exe
          path: src-tauri/target/x86_64-pc-windows-msvc/release/desktop-memo.exe

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-memo-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
        continue-on-error: true

      - name: Build MSI installer
        run: npx tauri build --bundles msi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-memo-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
        continue-on-error: true